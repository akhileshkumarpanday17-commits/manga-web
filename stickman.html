<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stick Fighter</title>
<style>
body{margin:0;background:#111;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;color:white;font-family:sans-serif;touch-action:none}
canvas{background:#222;border:2px solid #444;border-radius:12px}
#controls{display:flex;gap:10px;margin-top:12px}
button{padding:14px 22px;font-size:18px;border-radius:10px;border:none;background:#fff;color:#000;font-weight:bold;user-select:none}
#hp{width:340px;height:14px;background:#333;border-radius:6px;margin-bottom:8px;display:flex}
#hp div{height:100%;transition:width 0.2s}
#hp1{background:#4f4;width:50%}
#hp2{background:#f44;width:50%}
</style>
</head>
<body>
<div style="display:flex;justify-content:space-between;width:340px"><span>YOU</span><span>ENEMY</span></div>
<div id="hp"><div id="hp1"></div><div id="hp2"></div></div>
<canvas id="c" width="340" height="400"></canvas>
<div id="controls">
<button id="L">◀</button>
<button id="A">PUNCH</button>
<button id="K">KICK</button>
<button id="R">▶</button>
</div>
<script>
const ctx=document.getElementById('c').getContext('2d');
let x=80, ex=240, hp=100, ehp=100, punch=0, kick=0, ehit=0;
let keys={};

function stick(px,py,facing,state,col){
 ctx.strokeStyle=col;ctx.lineWidth=3;ctx.lineCap='round';
 ctx.beginPath();ctx.arc(px,py-30,12,0,Math.PI*2);ctx.stroke();
 ctx.beginPath();ctx.moveTo(px,py-18);ctx.lineTo(px,py+10);ctx.stroke();
 ctx.beginPath();ctx.moveTo(px,py-10);ctx.lineTo(px+(state.p?20:10)*facing,py-5);ctx.stroke();
 ctx.beginPath();ctx.moveTo(px,py-10);ctx.lineTo(px+(state.p?15:-10)*facing,py);ctx.stroke();
 ctx.beginPath();ctx.moveTo(px,py+10);ctx.lineTo(px-8+(state.k?20*facing:0),py+30);ctx.stroke();
 ctx.beginPath();ctx.moveTo(px,py+10);ctx.lineTo(px+8,py+30);ctx.stroke();
}

function loop(){
 ctx.clearRect(0,0,340,400);
 ctx.fillStyle='#2a2a2a';ctx.fillRect(0,330,340,70);

 if(keys['l']||keys['ArrowLeft']) x-=4;
 if(keys['r']||keys['ArrowRight']) x+=4;
 x=Math.max(30,Math.min(310,x));

 if(Math.random()<0.02) ex+= (Math.random()<0.5?-15:15);
 ex=Math.max(30,Math.min(310,ex));

 if(Math.abs(x-ex)<55){
   if(Math.random()<0.07) ehit=12;
   if(punch>0) ehp-=0.9;
   if(kick>0) ehp-=1.3;
 }
 if(ehit>0 && Math.abs(x-ex)<55) hp-=0.6;

 stick(x,300, ex>x?1:-1, {p:punch>0,k:kick>0}, '#fff');
 stick(ex,300, x>ex?1:-1, {p:ehit>0,k:false}, '#ff5555');

 if(punch>0) punch--; if(kick>0) kick--; if(ehit>0) ehit--;
 document.getElementById('hp1').style.width=hp+'%';
 document.getElementById('hp2').style.width=ehp+'%';

 if(hp<=0||ehp<=0){
  ctx.fillStyle='#fff';ctx.font='bold 32px sans-serif';
  ctx.fillText(ehp<=0?'YOU WIN!':'YOU LOSE',70,120);
  return;
 }
 requestAnimationFrame(loop);
}
document.getElementById('L').ontouchstart=()=>keys['l']=1;document.getElementById('L').ontouchend=()=>keys['l']=0;
document.getElementById('R').ontouchstart=()=>keys['r']=1;document.getElementById('R').ontouchend=()=>keys['r']=0;
document.getElementById('A').onclick=()=>punch=12;
document.getElementById('K').onclick=()=>kick=14;
window.onkeydown=e=>{keys[e.key]=1; if(e.code==='Space') punch=12; if(e.key==='k') kick=14;};
window.onkeyup=e=>keys[e.key]=0;
loop();
</script>
</body>
</html>
