<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Slayer Premium Moderate</title>
<style>
*{box-sizing:border-box;font-family:Arial Black,sans-serif}
body{margin:0;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;overflow:hidden}
#game{position:relative;width:360px;height:520px;background:radial-gradient(at 50% -10%,#2d1a1a,#0a0606 60%,#000 100%);border-radius:20px;border:1px solid #333;overflow:hidden}
#floor{position:absolute;bottom:0;width:100%;height:50px;background:linear-gradient(#1a1010,#000);border-top:1px solid #2a1a1a}
.char{position:absolute;bottom:50px;transition:left .15s ease-out}
#tanjiro{width:80px;height:180px;left:30px;z-index:3}
#muzan{width:80px;height:190px;left:230px;z-index:3}
.t-leg{position:absolute;width:12px;height:55px;background:#050505;bottom:0}.t-leg.l{left:12px}.t-leg.r{left:42px}
.t-wrap{position:absolute;width:16px;height:18px;background:#e0e0e0;bottom:38px;border:1px solid #000}.t-wrap.l{left:10px}.t-wrap.r{left:40px}
.t-sandal{position:absolute;width:20px;height:6px;background:#700;bottom:0;border-radius:2px}.t-sandal.l{left:8px}.t-sandal.r{left:38px}
.t-body{position:absolute;width:40px;height:58px;background:#111;left:20px;bottom:55px;border-radius:4px}
.t-haori{position:absolute;width:62px;height:62px;left:9px;bottom:53px;background:repeating-linear-gradient(90deg,#000 0 9px,#1e8a4a 9px 18px);border-radius:4px}
.t-arm{position:absolute;width:28px;height:9px;background:#f0c8a0;bottom:85px;border-radius:4px}.t-arm.back{left:-4px}.t-arm.front{left:40px;bottom:88px}
.t-sword{position:absolute;width:52px;height:6px;background:linear-gradient(90deg,#222,#00e5ff,#fff);left:68px;bottom:90px;border-radius:3px;box-shadow:0 0 10px #00e5ff;transform-origin:left center;transition:transform .12s}
.t-head{position:absolute;width:32px;height:32px;background:#ffcc99;left:24px;bottom:115px;border-radius:50%;border:2px solid #000}.t-hair{position:absolute;width:38px;height:18px;background:#000;left:21px;bottom:137px;border-radius:10px 10px 3px 3px}.t-hair::after{content:'';position:absolute;width:24px;height:7px;background:#a00;left:7px;top:3px;border-radius:3px}.t-scar{position:absolute;width:6px;height:4px;background:#800;left:4px;top:8px;border-radius:2px}.t-ear{position:absolute;width:7px;height:10px;background:#fff;border:1px solid #000;bottom:120px}.t-ear.l{left:14px}.t-ear.r{left:59px}.t-ear::after{content:'';position:absolute;width:5px;height:5px;background:red;left:1px;top:4px;border-radius:50%}
.m-leg{position:absolute;width:14px;height:60px;background:#f5f5f5;bottom:0;border:1px solid #ccc}.m-leg.l{left:14px}.m-leg.r{left:44px}.m-shoe{position:absolute;width:20px;height:7px;background:#000;bottom:0;border-radius:2px}.m-shoe.l{left:12px}.m-shoe.r{left:42px}.m-body{position:absolute;width:38px;height:55px;background:#fff;left:21px;bottom:60px;border-radius:4px;border:1px solid #ddd}.m-tie{position:absolute;width:7px;height:18px;background:#000;left:36px;bottom:70px}.m-arm{position:absolute;width:26px;height:9px;background:#ffddbb;bottom:82px;border-radius:4px}.m-arm.front{left:48px}.m-arm.back{left:-2px}.m-head{position:absolute;width:30px;height:30px;background:#ffddbb;left:25px;bottom:115px;border-radius:50%;border:2px solid #000}.m-hair{position:absolute;width:36px;height:16px;background:#000;left:22px;bottom:135px;border-radius:10px 10px 3px 3px}.m-eye{position:absolute;width:6px;height:4px;background:red;bottom:8px;border-radius:50%;box-shadow:0 0 8px red}.m-eye.l{left:5px}.m-eye.r{left:19px}.m-whip{position:absolute;width:70px;height:4px;background:linear-gradient(90deg,#ff3344,#ff8899);left:56px;border-radius:3px;transform-origin:left center;opacity:0;box-shadow:0 0 6px #f33}.muzan-attack .m-whip{opacity:1}.m-whip:nth-child(1){bottom:95px;transform:rotate(-18deg)}.m-whip:nth-child(2){bottom:88px;transform:rotate(-6deg)}.m-whip:nth-child(3){bottom:80px}.m-whip:nth-child(4){bottom:72px;transform:rotate(6deg)}.m-whip:nth-child(5){bottom:64px;transform:rotate(18deg)}@keyframes whipWave{0%{transform:rotate(-18deg) scaleX(1)}50%{transform:rotate(12deg) scaleX(1.1)}100%{transform:rotate(-18deg) scaleX(1)}}.muzan-attack .m-whip{animation:whipWave .22s infinite}
.fire .t-sword{background:linear-gradient(90deg,#300,#f00,#ff0) !important;box-shadow:0 0 16px #f00 !important}.fire #tanjiro{filter:drop-shadow(0 0 25px #ff4400)}
#hud{position:absolute;top:10px;left:10px;right:10px;z-index:20}.bars{display:flex;gap:6px}.bar{flex:1;height:14px;background:#111;border-radius:20px;border:1px solid #333;overflow:hidden;padding:2px}.fill{height:100%;border-radius:20px;width:100%;transition:width .2s}#hp1{background:linear-gradient(90deg,#0f8,#0f4);box-shadow:0 0 8px #0f8}#hp2{background:linear-gradient(90deg,#f33,#a00);box-shadow:0 0 8px #f00}#breath{height:10px;background:#111;border-radius:20px;border:1px solid #222;margin-top:6px;overflow:hidden;padding:2px}#bfill{height:100%;width:0%;background:linear-gradient(90deg,#0ef,#70f,#f30);border-radius:20px}
#ctrl{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;width:360px;margin-top:10px}.b{padding:12px 1px;border-radius:14px;border:none;font-weight:900;font-size:9px;box-shadow:0 4px 0 #000}.b:active{transform:translateY(3px)}.b:disabled{opacity:.25}
#over{position:absolute;inset:0;background:rgba(0,0,0,.93);display:none;align-items:center;justify-content:center;flex-direction:column;z-index:50;border-radius:20px;animation:pop .3s ease}
@keyframes pop{0%{transform:scale(.8);opacity:0}100%{transform:scale(1);opacity:1}}
#over h1{font-size:32px;margin:0;text-align:center;line-height:1.1;text-shadow:0 0 20px red}
#over p{font-size:12px;opacity:.7;margin:6px 0 0 0}
#over button{padding:16px 36px;border-radius:16px;border:none;font-weight:900;background:#fff;color:#000;margin-top:16px;font-size:14px;box-shadow:0 0 20px rgba(255,255,255,.4)}
canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
</style>
</head>
<body>
<div id="game">
<canvas id="fx" width="360" height="520"></canvas>
<div id="hud"><div style="display:flex;justify-content:space-between;font-size:9px;opacity:.8"><span>TANJIRO</span><span id="bt">0%</span><span>MUZAN</span></div><div class="bars"><div class="bar"><div id="hp1" class="fill"></div></div><div class="bar"><div id="hp2" class="fill"></div></div></div><div id="breath"><div id="bfill"></div></div></div>
<div id="floor"></div>
<div id="tanjiro" class="char"><div class="t-leg l"></div><div class="t-leg r"></div><div class="t-wrap l"></div><div class="t-wrap r"></div><div class="t-sandal l"></div><div class="t-sandal r"></div><div class="t-haori"></div><div class="t-body"></div><div class="t-arm back"></div><div class="t-arm front"></div><div class="t-sword" id="sword"></div><div class="t-head"><div class="t-scar"></div></div><div class="t-hair"></div><div class="t-ear l"></div><div class="t-ear r"></div></div>
<div id="muzan" class="char"><div class="m-leg l"></div><div class="m-leg r"></div><div class="m-shoe l"></div><div class="m-shoe r"></div><div class="m-body"></div><div class="m-tie"></div><div class="m-arm back"></div><div class="m-arm front"></div><div class="m-head"><div class="m-eye l"></div><div class="m-eye r"></div></div><div class="m-hair"></div><div class="m-whip"></div><div class="m-whip"></div><div class="m-whip"></div><div class="m-whip"></div><div class="m-whip"></div></div>
<div id="over"><h1 id="msg">MUZAN DEFEATED!</h1><p id="sub">Hashira would be proud</p><button onclick="restart()">RESTART BATTLE</button></div>
</div>
<div id="ctrl"><button class="b" id="L" style="background:#222;color:#fff">◀</button><button class="b" id="P" style="background:#fff">SLASH</button><button class="b" id="W" style="background:#00d4ff;color:#fff">WATER 30%</button><button class="b" id="R" style="background:#222;color:#fff">▶</button><button class="b" id="C" style="background:#000;color:#0ef;border:1px solid #0ef">BREATHE</button><button class="b" id="W10" style="background:#0fa">FLUX 45%</button><button class="b" id="Hino" style="background:linear-gradient(#f20,#fa0);color:#fff">HINOKAMI 80%</button><button class="b" id="U" style="background:linear-gradient(#f00,#ff0)">SUN 13TH</button></div>
<script>
const fx=document.getElementById('fx'), fctx=fx.getContext('2d');
let x=30, ex=230, hp=100, ehp=100, breath=0, fire=false, charge=false, pT=0,wT=0,epT=0,keys={},particles=[],gameOver=false,shake=0,lastAtk=0;
const tj=document.getElementById('tanjiro'), mz=document.getElementById('muzan'), sword=document.getElementById('sword');
function spawn(px,py,col,n){for(let i=0;i<n;i++)particles.push({x:px,y:py,vx:(Math.random()-0.5)*8,vy:(Math.random()-1)*6,life:1,col})}
function loop(){
 if(gameOver){requestAnimationFrame(loop);return;}
 fctx.clearRect(0,0,360,520);
 if(keys.l) x-=3.5; if(keys.r) x+=3.5; x=Math.max(0,Math.min(280,x));
 let now=Date.now();
 if(now-lastAtk>2500 && Math.random()<0.06 && epT==0){epT=35; lastAtk=now; mz.classList.add('muzan-attack');}
 if(epT>0){
   epT--;
   if(epT==18 && Math.abs(x-ex)<120){
     hp-=10; spawn(x+40,350,'#f00',12); shake=10;
     tj.style.marginLeft=`${x>ex?-14:14}px`; setTimeout(()=>tj.style.marginLeft='0px',140);
   }
   if(epT==0) mz.classList.remove('muzan-attack');
 }else{
   if(Math.abs(x-ex)>110) ex+=(x>ex?1.2:-1.2); else ex+=(x>ex?-0.6:0.6);
 }
 ex=Math.max(0,Math.min(280,ex));
 tj.style.left=x+'px'; mz.style.left=ex+'px';
 tj.style.transform=`scaleX(${ex>x?1:-1})`; mz.style.transform=`scaleX(${x>ex?1:-1})`;
 if(fire) document.getElementById('game').classList.add('fire'); else document.getElementById('game').classList.remove('fire');
 if(charge&&breath<100){breath+=0.85; if(Math.random()<0.35) spawn(x+40,380,fire?'#f40':'#0ef',1);}
 let dist=Math.abs(x-ex);
 if(pT==8 && dist<105){ehp-=fire?11:7; spawn(ex+40,360,'#fff',12); if(ehp<=0) end(true);}
 if(wT==8 && dist<125){ehp-=30; spawn(ex+40,360,'#0ef',22); fctx.strokeStyle='#0ef'; fctx.shadowColor='#0ef'; fctx.shadowBlur=15; fctx.lineWidth=4; fctx.beginPath(); fctx.arc(ex+40,370,35,0,6.28); fctx.stroke(); fctx.shadowBlur=0; if(ehp<=0) end(true); shake=12;}
 if(pT>0)pT--; if(wT>0)wT--;
 particles=particles.filter(p=>p.life>0);
 particles.forEach(p=>{p.x+=p.vx; p.vy+=0.3; p.y+=p.vy; p.life-=0.04; fctx.globalAlpha=p.life; fctx.fillStyle=p.col; fctx.beginPath(); fctx.arc(p.x,p.y,3,0,6.28); fctx.fill();}); fctx.globalAlpha=1;
 document.getElementById('hp1').style.width=hp+'%'; document.getElementById('hp2').style.width=ehp+'%';
 document.getElementById('bfill').style.width=breath+'%'; document.getElementById('bt').innerText=Math.floor(breath)+'%';
 document.getElementById('W').disabled=breath<30; document.getElementById('W10').disabled=breath<45; document.getElementById('Hino').disabled=breath<80; document.getElementById('U').disabled=breath<95;
 if(shake>0){document.getElementById('game').style.transform=`translate(${(Math.random()-0.5)*shake}px,0)`; shake--;}else document.getElementById('game').style.transform='';
 if(hp<=0) end(false);
 requestAnimationFrame(loop);
}
function end(win){
 gameOver=true;
 const msg=document.getElementById('msg'), sub=document.getElementById('sub');
 if(win){msg.innerText='MUZAN DEFEATED!'; msg.style.color='#0f8'; sub.innerText='Sun Breathing Mastered - Hashira would be proud';}
 else{msg.innerText='YOU FELL...'; msg.style.color='#f33'; sub.innerText='Train your Total Concentration Breathing';}
 document.getElementById('over').style.display='flex';
}
function restart(){hp=100;ehp=100;breath=0;x=30;ex=230;fire=false;gameOver=false;particles=[];epT=0;lastAtk=0;document.getElementById('over').style.display='none'; loop();}
document.getElementById('L').addEventListener('touchstart',e=>{e.preventDefault(); keys.l=true}); document.getElementById('L').addEventListener('touchend',()=>keys.l=false);
document.getElementById('R').addEventListener('touchstart',e=>{e.preventDefault(); keys.r=true}); document.getElementById('R').addEventListener('touchend',()=>keys.r=false);
document.getElementById('L').addEventListener('mousedown',()=>keys.l=true); document.getElementById('L').addEventListener('mouseup',()=>keys.l=false);
document.getElementById('R').addEventListener('mousedown',()=>keys.r=true); document.getElementById('R').addEventListener('mouseup',()=>keys.r=false);
document.getElementById('P').addEventListener('click',()=>{pT=15; sword.style.transform='rotate(-35deg)'; setTimeout(()=>sword.style.transform='rotate(0deg)',140)});
document.getElementById('W').addEventListener('click',()=>{if(breath>=30){breath-=30; wT=15; sword.style.transform='rotate(-55deg)'; setTimeout(()=>sword.style.transform='rotate(0deg)',220)}});
document.getElementById('W10').addEventListener('click',()=>{if(breath>=45){breath-=45; wT=18;}});
document.getElementById('C').addEventListener('touchstart',e=>{e.preventDefault(); charge=true}); document.getElementById('C').addEventListener('touchend',()=>charge=false);
document.getElementById('C').addEventListener('mousedown',()=>charge=true); document.getElementById('C').addEventListener('mouseup',()=>charge=false);
document.getElementById('Hino').addEventListener('click',()=>{if(breath>=80){breath-=80; fire=true; spawn(x+40,350,'#f40',18)}});
document.getElementById('U').addEventListener('click',()=>{if(breath>=95){breath=0; ehp-=48; spawn(ex+40,360,'#ff0',30); if(ehp<=0) end(true);}});
loop();
</script>
</body>
</html>
